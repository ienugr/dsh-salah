name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    name: Clean install / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.15.0'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # One isolated install/test/build pass per lane. The verifier checks the
      # generated artifact byte-for-byte without depending on a Git worktree.
      - name: Verify clean checkout and committed build artifact
        run: npm run check:clean-install
      - name: Audit locked runtime dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
